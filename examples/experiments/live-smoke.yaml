# 仅供手动执行的真实冒烟验证。
# 普通测试不会调用此文件，文件中也不包含凭据。
id: live-smoke
suite:
  id: smoke
  kind: smoke
  cases:
    - ../cases/verify-answer/case.yaml
variants:
  - id: codex-controlled
    agent: codex
    model: UNKNOWN
    run_mode: controlled
    observation_profile: minimal
  - id: claude-controlled
    agent: claude-code
    model: UNKNOWN
    run_mode: controlled
    observation_profile: minimal
  - id: hermes-controlled
    agent: hermes
    model: UNKNOWN
    run_mode: controlled
    observation_profile: minimal
trials: 1
max_concurrency: 1
