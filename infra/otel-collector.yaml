# 仅限本机的 Collector 配置。
# AEL 将 Collector 的三个本地 JSONL 文件作为一个 Evidence Source ingest；不向外部导出。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  file/traces:
    path: /output/traces.jsonl
    format: json
    append: true
  file/metrics:
    path: /output/metrics.jsonl
    format: json
    append: true
  file/logs:
    path: /output/logs.jsonl
    format: json
    append: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
