<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Agent Eval Lab</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #17212b; }
    header { background: #17212b; color: white; padding: 18px 28px; }
    nav a { color: #d9e7ef; margin-left: 20px; text-decoration: none; }
    main { max-width: 1240px; margin: 28px auto; padding: 0 20px 70px; }
    h1, h2, h3 { margin-top: 0; }
    section, .card { background: white; border: 1px solid #dfe5ea; border-radius: 12px; padding: 20px; margin: 16px 0; }
    .hero { display: flex; justify-content: space-between; gap: 20px; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .metric { background: #f7f9fb; border-radius: 10px; padding: 14px; }
    .metric strong { display: block; font-size: 24px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { text-align: left; padding: 11px; border-bottom: 1px solid #e6eaee; vertical-align: top; }
    th { color: #52616d; font-size: 13px; text-transform: none; letter-spacing: .03em; }
    code, pre, input, textarea, select, button { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #10151a; color: #d5f2df; padding: 14px; border-radius: 8px; max-height: 520px; overflow: auto; }
    input[type=text], input[type=number], textarea, select { border: 1px solid #cbd5dc; border-radius: 7px; padding: 8px; width: 100%; box-sizing: border-box; background: white; }
    textarea { min-height: 58px; }
    label { display: block; margin: 8px 0; }
    button, .button { border: 0; border-radius: 8px; padding: 10px 14px; background: #246bce; color: white; cursor: pointer; text-decoration: none; display: inline-block; }
    button.secondary, .button.secondary { background: #e8eef3; color: #17212b; }
    button:disabled { background: #bbc4ca; cursor: not-allowed; }
    .muted { color: #5f6b76; }
    .error { border-color: #e5a4a0; background: #fff3f2; color: #8d241e; }
    .pill { display: inline-block; padding: 3px 8px; border-radius: 12px; background: #edf1f5; font-size: 12px; }
    .pass, .STABLE_PASS { color: #087443; font-weight: 700; }
    .fail, .STABLE_FAIL { color: #b42318; font-weight: 700; }
    .unknown, .ERROR, .UNKNOWN { color: #8a5a00; font-weight: 700; }
    .FLAKY { color: #9b5a00; font-weight: 700; }
    .DIFFERENTIAL { color: #6a3db8; font-weight: 700; }
    .matrix { overflow-x: auto; }
    .matrix th, .matrix td { min-width: 150px; }
    .matrix th:first-child, .matrix td:first-child { min-width: 190px; position: sticky; left: 0; background: white; z-index: 1; }
    .matrix-cell { display: block; border: 1px solid #dfe5ea; border-radius: 9px; padding: 10px; color: inherit; text-decoration: none; background: #fbfcfd; }
    .matrix-cell:hover { border-color: #246bce; box-shadow: 0 2px 8px #17212b18; }
    .matrix-cell small { display: block; margin-top: 6px; }
    .choice { border: 1px solid #dfe5ea; border-radius: 10px; padding: 14px; }
    .choice.disabled { opacity: .55; }
    .choice-title { display: flex; gap: 8px; align-items: center; }
    .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    details { margin: 12px 0; }
    .eyebrow { margin: 0 0 6px; color: #6d7a86; font-size: 12px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .dot { margin: 0 5px; }
    .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    .section-lede { color: #596874; line-height: 1.55; max-width: 880px; }
    .run-hero { padding-bottom: 4px; background: transparent; border: 0; margin-bottom: 2px; }
    .run-hero h1 { letter-spacing: -.03em; }
    .run-scoreboard { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; background: transparent; border: 0; padding: 0; }
    .score-card { min-height: 104px; padding: 16px; border: 1px solid #dfe5ea; border-radius: 12px; background: #fff; box-shadow: 0 5px 18px #17212b0b; }
    .score-card span, .score-card small { display: block; color: #64737f; }
    .score-card strong { display: block; margin: 8px 0 4px; font-size: 26px; letter-spacing: -.03em; }
    .score-card em { font-size: 13px; font-style: normal; font-weight: 600; }
    .score-pass strong { color: #087443; }
    .score-fail strong { color: #b42318; }
    .trajectory-section, .telemetry-section, .evidence-section, .trace-section, .raw-section { padding: 24px; }
    .neutral { background: #f1f4f7; }
    .pill-success { background: #e5f6ed; color: #087443; }
    .pill-warning { background: #fff4d6; color: #8a5a00; }
    .trajectory-track { margin-top: 20px; }
    .trajectory-step { display: grid; grid-template-columns: 36px 18px minmax(0, 1fr); gap: 12px; min-height: 88px; }
    .trajectory-index { color: #7c8a95; font: 700 12px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .trajectory-rail { position: relative; display: flex; justify-content: center; }
    .trajectory-rail::before { content: ""; width: 2px; background: #d9e1e7; position: absolute; top: 4px; bottom: -12px; }
    .trajectory-step:last-child .trajectory-rail::before { bottom: 48px; }
    .trajectory-rail span { position: relative; z-index: 1; width: 10px; height: 10px; margin-top: 6px; border: 3px solid #fff; border-radius: 50%; background: #246bce; box-shadow: 0 0 0 1px #246bce; }
    .trajectory-mutate .trajectory-rail span { background: #b85b00; box-shadow: 0 0 0 1px #b85b00; }
    .trajectory-verify .trajectory-rail span { background: #6a3db8; box-shadow: 0 0 0 1px #6a3db8; }
    .trajectory-complete .trajectory-rail span { background: #087443; box-shadow: 0 0 0 1px #087443; }
    .trajectory-step.is-failed .trajectory-rail span { background: #b42318; box-shadow: 0 0 0 1px #b42318; }
    .trajectory-body { padding: 0 0 18px; }
    .trajectory-titleline { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .trajectory-titleline strong { font-size: 16px; }
    .trajectory-body p { margin: 7px 0; color: #52616d; }
    .trajectory-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: #7a8791; font-size: 12px; }
    .group-badge, .signal-chip, .kind-chip, .status-chip, .result-chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 8px; font-size: 11px; font-weight: 750; letter-spacing: .02em; }
    .group-read { color: #246bce; background: #e9f1ff; }
    .group-mutate { color: #a44e00; background: #fff0dd; }
    .group-tool { color: #46606f; background: #edf3f6; }
    .group-verify { color: #6a3db8; background: #f0eaff; }
    .group-complete { color: #087443; background: #e5f6ed; }
    .trajectory-status { margin-left: auto; font-size: 12px; font-weight: 700; }
    .status-success, .status-pass { color: #087443; }
    .status-failed, .status-fail { color: #b42318; }
    .status-observed { color: #61727d; }
    .telemetry-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
    .telemetry-card { min-height: 90px; padding: 14px; border: 1px solid #e3e9ee; border-radius: 10px; background: #f8fafc; }
    .telemetry-card > span, .telemetry-card small { display: block; color: #64737f; }
    .telemetry-card strong { display: block; margin: 7px 0 4px; font-size: 23px; letter-spacing: -.03em; }
    .telemetry-card small { font-size: 12px; }
    .telemetry-lower { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 16px; }
    .signal-panel, .telemetry-context { padding: 16px; border: 1px solid #e3e9ee; border-radius: 10px; background: #fff; }
    .subsection-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .signal-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #edf1f4; }
    .signal-row:last-child { border-bottom: 0; }
    .signal-row > div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .signal-row .muted { font-size: 12px; }
    .signal-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; }
    .signal-logs { background: #246bce; }
    .signal-metrics { background: #b85b00; }
    .signal-traces { background: #6a3db8; }
    .signal-native { background: #52616d; }
    .detail-list { margin: 0; }
    .detail-list div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid #edf1f4; }
    .detail-list div:last-child { border-bottom: 0; }
    .detail-list dt { color: #6a7883; }
    .detail-list dd { margin: 0; font-weight: 650; text-align: right; overflow-wrap: anywhere; }
    .evidence-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
    .evidence-card { padding: 16px; border: 1px solid #e0e7ec; border-radius: 10px; background: #f8fafc; }
    .evidence-card.evidence-observed { border-top: 3px solid #3aa676; }
    .evidence-card.evidence-unknown { border-top: 3px solid #c7a34a; background: #fffcf3; }
    .evidence-card-head { display: flex; justify-content: space-between; gap: 12px; color: #52616d; font-size: 13px; font-weight: 700; }
    .evidence-state { font-size: 11px; font-weight: 700; }
    .evidence-card.evidence-observed .evidence-state { color: #087443; }
    .evidence-card.evidence-unknown .evidence-state { color: #8a5a00; }
    .evidence-card > strong { display: block; margin: 10px 0 6px; font-size: 22px; }
    .evidence-card p { margin: 0; color: #64737f; font-size: 12px; line-height: 1.5; }
    .trace-total { min-width: 110px; padding: 10px 12px; border: 1px solid #e0e7ec; border-radius: 9px; background: #f8fafc; text-align: right; }
    .trace-total span, .trace-total strong { display: block; }
    .trace-total span { color: #6d7a86; font-size: 12px; }
    .trace-total strong { margin-top: 3px; font-size: 18px; }
    .trace-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin: 18px 0 12px; color: #52616d; font-size: 12px; }
    .trace-legend .signal-dot { margin-right: 4px; }
    .trace-time-axis { position: relative; height: 18px; margin: 0 12px; color: #778590; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .trace-time-axis span { position: absolute; transform: translateX(-50%); }
    .trace-time-axis span:first-child { transform: none; }
    .trace-time-axis span:last-child { transform: translateX(-100%); }
    .trace-waterfall { overflow: hidden; border: 1px solid #dfe6eb; border-radius: 10px; background: #fbfcfd; }
    .trace-axis, .trace-row summary { display: grid; grid-template-columns: 32px 76px minmax(110px, 22%) minmax(300px, 1fr) 78px 74px; align-items: center; gap: 10px; }
    .trace-axis { padding: 9px 12px; color: #778590; border-bottom: 1px solid #e5ebef; font-size: 11px; font-weight: 700; text-transform: none; letter-spacing: 0; }
    .trace-axis span:nth-child(2) { grid-column: 4; }
    .trace-axis span:nth-child(3) { grid-column: 6; }
    .trace-row { margin: 0; border-bottom: 1px solid #edf1f4; background: #fff; }
    .trace-row:last-child { border-bottom: 0; }
    .trace-row summary { min-height: 54px; padding: 5px 12px; cursor: pointer; list-style: none; }
    .trace-row summary::-webkit-details-marker { display: none; }
    .trace-row summary:hover { background: #f7fafc; }
    .trace-seq { color: #9aa6ae; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .trace-offset { color: #687781; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .trace-lane { position: relative; height: 22px; border-left: 1px solid #dfe6eb; background-image: linear-gradient(90deg, transparent 24%, #edf1f4 25%, transparent 26%, transparent 49%, #edf1f4 50%, transparent 51%, transparent 74%, #edf1f4 75%, transparent 76%); }
    .trace-lane i { position: absolute; top: 7px; min-width: 4px; height: 8px; border-radius: 5px; background: #246bce; }
    .trace-signal-metrics .trace-lane i { background: #b85b00; }
    .trace-signal-traces .trace-lane i { background: #6a3db8; }
    .trace-signal-native .trace-lane i { background: #52616d; }
    .trace-operation { min-width: 0; }
    .trace-operation strong { margin-left: 6px; font-size: 13px; }
    .trace-operation small { display: block; margin-top: 4px; overflow: hidden; color: #71808b; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .signal-chip { margin-right: 3px; padding: 3px 6px; font-size: 10px; }
    .signal-chip-logs { color: #1f5eaf; background: #e9f1ff; }
    .signal-chip-metrics { color: #a44e00; background: #fff0dd; }
    .signal-chip-traces { color: #6a3db8; background: #f0eaff; }
    .signal-chip-native { color: #46606f; background: #edf3f6; }
    .kind-chip { color: #596874; background: #f0f3f5; font-size: 10px; }
    .trace-status { font-size: 11px; font-weight: 700; white-space: nowrap; }
    .trace-duration { color: #677680; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; white-space: nowrap; }
    .trace-detail { padding: 16px 52px 18px 130px; border-top: 1px solid #edf1f4; background: #f8fafc; }
    .trace-detail-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .trace-detail-summary p { margin: 6px 0 12px; color: #33434f; }
    .attribute-table { font-size: 12px; }
    .attribute-table th, .attribute-table td { padding: 7px 9px; }
    .attribute-table th:first-child, .attribute-table td:first-child { width: 34%; }
    .raw-section details { padding: 2px 0; }
    .empty-state { padding: 22px; border: 1px dashed #cad5dc; border-radius: 10px; color: #596874; background: #fafcfd; }
    .empty-state p { margin-bottom: 0; }
    .result-pass { color: #087443; background: #e5f6ed; }
    .result-fail { color: #b42318; background: #ffebea; }
    .result-unknown { color: #8a5a00; background: #fff4d6; }
    .evidence-detail-section .card { margin: 0; }
    .home-hero, .builder-hero, .setup-hero, .failure-hero, .failure-detail-hero { display: flex; align-items: center; justify-content: space-between; gap: 28px; padding: 34px; border: 1px solid #dfe5ea; border-radius: 16px; background: linear-gradient(135deg, #fff 0%, #f1f7ff 100%); }
    .home-hero h1, .builder-hero h1, .setup-hero h1, .failure-hero h1, .failure-detail-hero h1 { margin-bottom: 10px; letter-spacing: -.04em; }
    .home-lede { max-width: 720px; color: #50616e; font-size: 16px; line-height: 1.65; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .home-illustration { min-width: 280px; padding: 22px; border: 1px solid #cfe0f0; border-radius: 14px; background: #fff; box-shadow: 0 12px 30px #246bce16; }
    .home-illustration-label { color: #246bce; font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .home-path { display: flex; align-items: center; gap: 10px; margin: 25px 0 12px; color: #182733; }
    .home-path b { padding: 8px 10px; border-radius: 8px; background: #edf4ff; }
    .home-path i { color: #8ba5be; font-style: normal; }
    .home-illustration p { margin: 0; color: #6d7a86; font-size: 12px; }
    .home-stats, .setup-summary, .failure-summary, .failure-detail-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; border: 0; padding: 0; background: transparent; }
    .home-stats > div, .setup-summary > div, .failure-summary > div, .failure-detail-summary > div { min-height: 94px; padding: 16px; border: 1px solid #dfe5ea; border-radius: 12px; background: #fff; }
    .home-stats span, .home-stats small, .setup-summary span, .setup-summary small, .failure-summary span, .failure-summary small, .failure-detail-summary span, .failure-detail-summary small { display: block; color: #697884; }
    .home-stats strong, .setup-summary strong, .failure-summary strong, .failure-detail-summary strong { display: block; margin: 8px 0 3px; font-size: 25px; letter-spacing: -.03em; }
    .running-section, .recent-section, .agent-catalog-section, .case-catalog-section, .failure-list-section, .failure-lifecycle-section, .failure-runs-section, .failure-actions, .promotion-section, .follow-up-result, .builder-section, .builder-submit, .matrix-section, .focus-section, .run-detail-section, .key-difference-section, .trajectory-compare-section, .span-compare-section, .diagnosis-section { padding: 24px; }
    .experiment-card-grid, .agent-catalog-grid, .case-catalog-grid, .failure-card-grid, .focus-grid, .case-group-grid, .agent-builder-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .experiment-card, .agent-catalog-card, .case-catalog-card, .failure-card, .focus-card, .trace-compare-pane, .agent-builder-card, .custom-harness-card, .case-group { display: block; padding: 18px; border: 1px solid #dfe5ea; border-radius: 12px; background: #fff; color: inherit; text-decoration: none; }
    .experiment-card:hover, .focus-card:hover, .failure-card:hover { border-color: #246bce; box-shadow: 0 7px 20px #17212b12; transform: translateY(-1px); }
    .experiment-card-top, .failure-card-head, .agent-catalog-head, .case-card-head, .agent-builder-head, .subsection-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .experiment-card h3, .agent-catalog-card h3, .case-catalog-card h3, .failure-card h3, .focus-card strong { margin: 14px 0 8px; font-size: 17px; overflow-wrap: anywhere; }
    .experiment-card p, .focus-card p { line-height: 1.5; }
    .experiment-card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 16px; }
    .differential-tag { display: inline-block; color: #6a3db8; font-size: 11px; font-weight: 800; letter-spacing: .04em; }
    .status-pill-completed { color: #087443; background: #e5f6ed; }
    .status-pill-running, .status-pill-pending { color: #246bce; background: #e9f1ff; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #8e9ca6; }
    .status-running { background: #246bce; box-shadow: 0 0 0 4px #e9f1ff; }
    .progress-line { height: 5px; margin-top: 17px; overflow: hidden; border-radius: 5px; background: #e8eef2; }
    .progress-line i { display: block; height: 100%; border-radius: inherit; background: #246bce; }
    .builder-steps { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 22px; color: #768590; font-size: 13px; }
    .builder-steps span { display: inline-flex; align-items: center; gap: 6px; }
    .builder-steps span.active { color: #246bce; font-weight: 750; }
    .builder-steps b { display: inline-grid; width: 22px; height: 22px; place-items: center; border-radius: 50%; background: #e9f1ff; }
    .builder-steps i { font-style: normal; color: #a2afb8; }
    .selection-count { padding: 7px 10px; border-radius: 999px; color: #246bce; background: #e9f1ff; font-size: 12px; font-weight: 750; }
    .case-group-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 18px; }
    .case-group { min-width: 0; }
    .case-group legend { display: flex; align-items: center; gap: 8px; padding: 0; font-size: 16px; }
    .case-group-prompt { margin: 10px 0 14px; color: #596874; font-size: 13px; line-height: 1.5; }
    .case-revision-list { display: grid; gap: 7px; }
    .case-revision { display: flex; gap: 9px; padding: 10px; border: 1px solid #e3e9ee; border-radius: 8px; background: #f9fbfc; cursor: pointer; }
    .case-revision:has(input:checked) { border-color: #246bce; background: #f1f7ff; box-shadow: inset 3px 0 #246bce; }
    .case-revision strong, .case-revision small { display: block; }
    .case-revision small { margin-top: 4px; color: #75838e; font-size: 11px; overflow-wrap: anywhere; }
    .agent-builder-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 18px; }
    .agent-builder-card.is-disabled, .agent-catalog-card.is-disabled { opacity: .65; background: #f7f9fa; }
    .agent-builder-head .choice-title { display: flex; align-items: center; gap: 8px; margin: 0; }
    .agent-version { margin: 8px 0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .agent-capability-note, .agent-catalog-note { min-height: 42px; color: #64737f; font-size: 12px; line-height: 1.5; }
    .agent-config-fields { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e8edf0; }
    .unsupported-note { margin-top: 14px; padding: 10px; border-radius: 8px; color: #8a5a00; background: #fff6df; font-size: 12px; }
    .custom-harness-card { margin-top: 14px; background: #fbfcfd; }
    .builder-strategy-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
    .run-preview-card { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 18px; padding: 16px; border: 1px solid #cfe0f0; border-radius: 10px; background: #f1f7ff; }
    .run-preview-card p { margin: 6px 0 0; color: #52616d; font-size: 13px; }
    .preview-equation { min-width: 110px; text-align: center; }
    .preview-equation strong, .preview-equation span { display: block; }
    .preview-equation strong { font-size: 28px; color: #246bce; }
    .preview-equation span { color: #52616d; font-size: 12px; }
    .builder-submit { display: flex; align-items: center; justify-content: space-between; gap: 18px; border: 1px solid #bfd6ed; background: #edf5ff; }
    .builder-submit p { margin: 6px 0 0; color: #52616d; font-size: 13px; }
    .capability-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .capability-pill { padding: 4px 7px; border-radius: 999px; color: #53636e; background: #edf3f6; font-size: 11px; }
    .case-card-head { align-items: flex-start; }
