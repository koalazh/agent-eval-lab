<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Agent Eval Lab</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f6f8; color: #18202a; }
    header { background: #17212b; color: white; padding: 18px 28px; }
    nav a { color: #d5e5ef; margin-right: 18px; text-decoration: none; }
    main { max-width: 1180px; margin: 28px auto; padding: 0 20px 60px; }
    h1 { margin-top: 0; }
    section, .card { background: white; border: 1px solid #dfe5ea; border-radius: 10px; padding: 18px; margin: 14px 0; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e6eaee; vertical-align: top; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #10151a; color: #d5f2df; padding: 14px; border-radius: 8px; max-height: 520px; overflow: auto; }
    .pass { color: #087443; font-weight: 700; }
    .fail { color: #b42318; font-weight: 700; }
    .unknown { color: #8a5a00; font-weight: 700; }
    .muted { color: #5f6b76; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #edf1f5; }
  </style>
</head>
<body>
<header>
  <strong>Agent Eval Lab</strong>
  <nav style="display:inline-block; margin-left:26px">
    <a href="/agents">Agents</a>
    <a href="/cases">Cases</a>
    <a href="/experiments">Experiments</a>
    <a href="/failures">Failures</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
