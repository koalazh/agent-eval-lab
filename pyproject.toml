[project]
name = "agent-eval-lab"
version = "0.1.0"
description = "用于理解 Coding Agent 如何以及为何变化的本地实验系统。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "pyyaml>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
ael = "ael.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ael"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
